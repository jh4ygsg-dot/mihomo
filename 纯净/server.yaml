mode: rule
log-level: info
ipv6: false

listeners:
- name: vless
  type: vless
  listen: 0.0.0.0
  port: 443
  users:
  - username: 1
    uuid: YOUR_PASSWORD
    flow: xtls-rprx-vision
  certificate: /etc/mihomo/fullchain.pem
  private-key: /etc/mihomo/private-key.pem
- name: hy2
  type: hysteria2
  listen: 0.0.0.0
  port: 443
  users:
    hy2: YOUR_HY2_PASSWORD
  certificate: /etc/mihomo/fullchain.pem
  private-key: /etc/mihomo/private-key.pem

rules:
- MATCH,DIRECT
