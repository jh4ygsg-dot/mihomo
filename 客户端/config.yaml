mode: rule
mixed-port: 7897
allow-lan: false
log-level: warning
ipv6: true

geodata-mode: true
geo-auto-update: true
geo-update-interval: 24
geox-url:
  geoip: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip.dat"
  geosite: "https://testingcf.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"

profile:
  store-selected: true

tun:
  enable: true
  stack: mixed
  auto-route: true
  auto-detect-interface: true
  strict-route: true
  dns-hijack:
  - any:53
  mtu: 1500

dns:
  default-nameserver:
  - system
  - 223.6.6.6
  - 8.8.8.8
  - 2400:3200::1
  - 2001:4860:4860::8888
  direct-nameserver: []
  direct-nameserver-follow-policy: false
  enable: true
  enhanced-mode: fake-ip
  fake-ip-filter:
  - '*.lan'
  - '*.local'
  - '*.arpa'
  - 'time.*.com'
  - 'ntp.*.com'
  - 'time.*.com'
  - '+.market.xiaomi.com'
  - localhost.ptlogin2.qq.com
  - '*.msftncsi.com'
  - www.msftconnecttest.com
  fake-ip-filter-mode: blacklist
  fake-ip-range: 198.18.0.1/16
  fake-ip-range6: fdfe:dcba:9876::1/64
  fallback: []
  fallback-filter:
    domain:
    - +.google.com
    - +.facebook.com
    - +.youtube.com
    geoip: true
    geoip-code: CN
    ipcidr:
    - 240.0.0.0/4
    - 0.0.0.0/32
  ipv6: true
  listen: :53
  nameserver:
  - 8.8.8.8
  - https://doh.pub/dns-query
  - https://dns.alidns.com/dns-query
  prefer-h3: false
  proxy-server-nameserver:
  - https://doh.pub/dns-query
  - https://dns.alidns.com/dns-query
  - tls://223.5.5.5
  respect-rules: false
  use-hosts: false
  use-system-hosts: false

proxies:
- name: "vless"
  type: vless
  server: YOUR_VPS_DOMAIN
  port: 443
  uuid: YOUR_PASSWORD
  flow: xtls-rprx-vision
  client-fingerprint: chrome
  packet-encoding: xudp
  udp: true
  tls: true
  servername: YOUR_VPS_DOMAIN
  skip-cert-verify: false
  network: tcp
- name: "hy2"
  type: hysteria2
  server: YOUR_VPS_DOMAIN
  port: 443
  password: YOUR_PASSWORD
  sni: YOUR_VPS_DOMAIN
  skip-cert-verify: false

proxy-groups:
- name: "节点选择"
  type: select
  include-all: true
  exclude-type: direct

rules:
- GEOIP,lan,DIRECT,no-resolve
- GEOSITE,CN,DIRECT
- GEOIP,CN,DIRECT
- MATCH,节点选择
